name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create submodule tags
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git tag "companion/transport/${VERSION}"
          git tag "hardware/transport/${VERSION}"

      - name: Push submodule tags
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git push origin "companion/transport/${VERSION}"
          git push origin "hardware/transport/${VERSION}"

      - name: Create GitHub Release
        run: |
          gh release create "${{ steps.version.outputs.version }}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
